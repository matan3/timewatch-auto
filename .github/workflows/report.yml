name: TimeWatch daily report

on:
  schedule:
    # Sunday-Thursday. Two triggers (16:50 and 17:50 UTC) so that one lands just
    # before 20:00 Israel time in both winter and summer; the script skips the
    # other one, then waits for a random minute between 20:00 and 21:00.
    - cron: "50 16,17 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - only show what would be reported"
        type: boolean
        default: true
      inspect_dates:
        description: "Read-only: show what is filled on these dates (YYYY-MM-DD, space separated)"
        type: string
        default: ""
      test_alert:
        description: "Send a test alert email (fails on purpose, changes nothing)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # only for the keep-alive step below

concurrency:
  group: timewatch-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Report hours
        env:
          TW_COMPANY: ${{ secrets.TW_COMPANY }}
          TW_EMPLOYEE: ${{ secrets.TW_EMPLOYEE }}
          TW_PASSWORD: ${{ secrets.TW_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          START_TIME: ${{ vars.START_TIME }}
          START_JITTER_MIN: ${{ vars.START_JITTER_MIN }}
          DAY_LENGTH: ${{ vars.DAY_LENGTH }}
          RUN_WINDOW: ${{ vars.RUN_WINDOW }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          # Scheduled runs report for real; manual runs follow the "Dry run" checkbox.
          DRY_RUN: ${{ (github.event_name == 'schedule' || !inputs.dry_run) && 'false' || 'true' }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
          INSPECT_DATES: ${{ inputs.inspect_dates }}
          # Optional. If empty, project and location are copied from the same weekday last week.
          PROJECT_CODE: ${{ vars.PROJECT_CODE }}
          HOME_DAYS: ${{ vars.HOME_DAYS }}
          HOME_TEXT: ${{ vars.HOME_TEXT }}
          OFFICE_TEXT: ${{ vars.OFFICE_TEXT }}
        run: python tw_report.py
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without repo activity.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/report.yml/enable" || true
