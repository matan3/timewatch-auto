name: TimeWatch daily report

on:
  # Automatic daily run is OFF until approved.
  # schedule:
  #   # Sunday-Thursday. Two triggers (16:50 and 17:50 UTC) so that one lands just
  #   # before 20:00 Israel time in both winter and summer; the script skips the
  #   # other one, then waits for a random minute between 20:00 and 21:00.
  #   - cron: "50 16,17 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - only show what would be reported"
        type: boolean
        default: true
      inspect_dates:
        description: "Read-only: show what is filled on these dates (YYYY-MM-DD, space separated)"
        type: string
        default: ""
      test_alert:
        description: "Send a test alert email (fails on purpose, changes nothing)"
        type: boolean
        default: false

concurrency:
  group: timewatch-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Report hours
        env:
          TW_COMPANY: ${{ secrets.TW_COMPANY }}
          TW_EMPLOYEE: ${{ secrets.TW_EMPLOYEE }}
          TW_PASSWORD: ${{ secrets.TW_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          START_TIME: ${{ vars.START_TIME }}
          START_JITTER_MIN: ${{ vars.START_JITTER_MIN }}
          DAY_LENGTH: ${{ vars.DAY_LENGTH }}
          RUN_WINDOW: ${{ vars.RUN_WINDOW }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          DEFAULT_HOURS: ${{ vars.DEFAULT_HOURS }}
          # Real updates only for a manual run with "Dry run" unticked. Scheduled runs are still test-only.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && 'false' || 'true' }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
          INSPECT_DATES: ${{ inputs.inspect_dates }}
          PROJECT_CODE: "94735"
          HOME_DAYS: "mon,wed"
        run: python tw_report.py
      - name: Save debug pages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
